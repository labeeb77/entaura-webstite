name: Build and Deploy - Entaura Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entaura-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Create production environment
        run: |
          echo "VITE_ENTAURA_WS_URL=${{ vars.VITE_ENTAURA_WS_URL }}" >> .env.production
          echo "VITE_ENTAURA_API_KEY=${{ secrets.VITE_ENTAURA_API_KEY }}" >> .env.production
          echo "VITE_ENTAURA_PROJECT_KEY=${{ vars.VITE_ENTAURA_PROJECT_KEY }}" >> .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Assets first, so new HTML never references files that aren't uploaded yet.
      - name: Upload assets to S3
        run: |
          aws s3 sync dist/ s3://entaura.ai/ \
            --delete \
            --exclude "*.html"

      # postbuild writes one .html per route; none of them may be cached.
      - name: Upload HTML pages
        run: |
          aws s3 sync dist/ s3://entaura.ai/ \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EFAF7F1TDZH8B \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully"
          echo "Website: https://entaura.ai"
